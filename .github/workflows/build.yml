name: Build bubuKernel

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'اختر الموديل (مثال: d2s للنوت 10 بلس)'
        required: true
        default: 'd2s'
        type: choice
        options:
          - 'd2s'
          - 'd2x'
          - 'd1'
          - 'beyond0lte'
          - 'beyond1lte'
          - 'beyond2lte'
          - 'beyondx'
      ksu:
        description: 'دمج KernelSU للنظام؟ (y/n)'
        required: true
        default: 'y'
        type: choice
        options:
          - 'y'
          - 'n'
      recovery:
        description: 'بناء للريكفري TWRP؟ (y/n)'
        required: true
        default: 'n'
        type: choice
        options:
          - 'n'
          - 'y'

jobs:
  build-kernel:
    runs-on: ubuntu-latest # البديل الأسرع والأحدث المتاح

    steps:
    - name: 1. جلب السورس كود والمجلدات الفرعية
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: 2. تهيئة بيئة بناء الأندرويد
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
        lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
        libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
        squashfs-tools xsltproc zip zlib1g-dev python3 \
        gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: 3. تنفيذ عملية الطبخ
      run: |
        # تعريف المترجمات المساعدة لضمان التوافق مع النواة القديمة
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export LD=aarch64-linux-gnu-ld
        export AR=aarch64-linux-gnu-ar
        export NM=aarch64-linux-gnu-nm
        export OBJCOPY=aarch64-linux-gnu-objcopy
        export OBJDUMP=aarch64-linux-gnu-objdump
        export READELF=aarch64-linux-gnu-readelf
        export STRIP=aarch64-linux-gnu-strip
        
        chmod +x build.sh
        
        # تشغيل السكربت بالخيارات المختارة
        ./build.sh -m ${{ github.event.inputs.model }} \
                   -k ${{ github.event.inputs.ksu }} \
                   -r ${{ github.event.inputs.recovery }}

    - name: 4. رفع الملف الناتج
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-${{ github.event.inputs.model }}
        path: build/out/${{ github.event.inputs.model }}/*.zip
