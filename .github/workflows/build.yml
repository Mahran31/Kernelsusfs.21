name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'اختر موديل الهاتف'
        required: true
        type: choice
        options: [beyond0lte, beyond1lte, beyond2lte, beyondx, d1, d1xks, d2s, d2x, d2xks]
      ksu:
        description: 'دمج KernelSU للنظام'
        required: false
        type: choice
        options: ['y', 'n']
        default: 'y'
      recovery:
        description: 'بناء للريكفري Android Recovery'
        required: false
        type: choice
        options: ['y', 'n']
        default: 'n'

jobs:
  build:
    runs-on: ubuntu-22.04 # نستخدم السيرفر المباشر بدلاً من الحاوية لتجنب نقص Git

    steps:
      - name: 1. جلب السورس كود والمجلدات الفرعية
        uses: actions/checkout@v4
        with:
          submodules: recursive # الآن ستعمل لأن Git موجود أصلاً في السيرفر

      - name: 2. تثبيت كافة أدوات الطبخ والمترجمات
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev bc curl zip git cpio \
            python3 rsync lzop libncurses5 libncurses5-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu llvm lld

      - name: 3. الحقن الجراحي وتشغيل البناء (حل مشكلة ThinLTO و VDSO)
        run: |
          # نستخدم ld.lld ليفهم خيارات المطور المتطورة (مثل --thinlto-cache-dir)
          # ونحقن المسارات لضمان وصول المترجم لكل المكتبات
          sed -i 's/O=out/O=out \\\nLD=ld.lld \\\nCROSS_COMPILE=aarch64-linux-gnu- \\\nCROSS_COMPILE_ARM32=arm-linux-gnueabi- \\\nLD_LIBRARY_PATH=$PWD\/toolchain\/neutron_18\/lib:$LD_LIBRARY_PATH/g' build.sh
          
          chmod +x build.sh
          ./build.sh \
            --model "${{ github.event.inputs.model }}" \
            --ksu "${{ github.event.inputs.ksu }}" \
            --recovery "${{ github.event.inputs.recovery }}"
      
      - name: 4. رفع الملف الناتج (ZIP)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.model }}-zip
          path: build/out/${{ github.event.inputs.model }}/*.zip
          retention-days: 30
