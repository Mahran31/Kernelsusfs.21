name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Phone model code'
        required: true
        type: choice
        options:
          - beyond0lte
          - beyond1lte
          - beyond2lte
          - beyondx
          - d1
          - d1xks
          - d2s
          - d2x
          - d2xks
      ksu:
        description: 'Include KernelSU'
        required: false
        type: choice
        options:
          - 'y'
          - 'n'
        default: 'y'
      recovery:
        description: 'Build for Android Recovery'
        required: false
        type: choice
        options:
          - 'y'
          - 'n'
        default: 'n'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            bc \
            curl \
            zip \
            git \
            cpio
      
      - name: Run build script
        run: |
          chmod +x build.sh
          ./build.sh \
            --model "${{ github.event.inputs.model }}" \
            --ksu "${{ github.event.inputs.ksu }}" \
            --recovery "${{ github.event.inputs.recovery }}"
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.model }}-build
          path: build/out/${{ github.event.inputs.model }}/
          retention-days: 30
      
      - name: Upload release zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.model }}-zip
          path: build/out/${{ github.event.inputs.model }}/*.zip
          retention-days: 30

