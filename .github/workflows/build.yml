name: Build bubuKernel

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'اختر الموديل (مثال: d2s)'
        required: true
        default: 'd2s'
        type: choice
        options: [d2s, d2x, d1, beyond0lte, beyond1lte, beyond2lte, beyondx]
      ksu:
        description: 'دمج KernelSU؟ (y/n)'
        required: true
        default: 'y'
        type: choice
        options: [y, n]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. جلب الكود
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: 2. تثبيت الأدوات (النسخة المتوافقة)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
        liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 python3 zip lzop rsync \
        gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: 3. الحقن الجراحي وتشغيل البناء
      run: |
        # هذه الخطوة هي الأهم: سنقوم بإضافة LD و CROSS_COMPILE مباشرة داخل متغير MAKE_ARGS في السكربت
        # لكي يراها الكيرنل أثناء بناء الـ VDSO
        sed -i 's/O=out/O=out \\\nLD=aarch64-linux-gnu-ld \\\nCROSS_COMPILE=aarch64-linux-gnu- \\\nCROSS_COMPILE_ARM32=arm-linux-gnueabi-/g' build.sh
        
        chmod +x build.sh
        ./build.sh -m ${{ github.event.inputs.model }} -k ${{ github.event.inputs.ksu }} -r n

    - name: 4. رفع الملف الناتج
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Ready-${{ github.event.inputs.model }}
        path: build/out/${{ github.event.inputs.model }}/*.zip
