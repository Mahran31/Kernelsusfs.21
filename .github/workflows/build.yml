name: Build bubuKernel

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'اختر موديل الهاتف (مثال: d2s للنوت 10 بلس)'
        required: true
        default: 'd2s'
        type: choice
        options:
          - 'd2s'
          - 'd2x'
          - 'd1'
          - 'beyond0lte'
          - 'beyond1lte'
          - 'beyond2lte'
          - 'beyondx'
      ksu:
        description: 'هل تريد دمج KernelSU للنظام؟ (y=نعم / n=لا)'
        required: true
        default: 'y'
        type: choice
        options:
          - 'y'
          - 'n'
      recovery:
        description: 'هل تريد بناء كيرنل للريكفري TWRP بدلاً من النظام؟ (y=نعم / n=لا)'
        required: true
        default: 'n'
        type: choice
        options:
          - 'n'
          - 'y'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. استدعاء السورس كود والمجلدات الفرعية
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: 2. تجهيز بيئة لينكس (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: 3. تشغيل سكربت الطبخ الأصلي بكامل خياراته
      run: |
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        chmod +x build.sh
        ./build.sh -m ${{ github.event.inputs.model }} -k ${{ github.event.inputs.ksu }} -r ${{ github.event.inputs.recovery }}

    - name: 4. التقاط ورفع ملف الـ ZIP الجاهز
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Ready-${{ github.event.inputs.model }}
        path: build/out/${{ github.event.inputs.model }}/*.zip
