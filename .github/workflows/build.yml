name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'اختر موديل الهاتف'
        required: true
        type: choice
        options: [beyond0lte, beyond1lte, beyond2lte, beyondx, d1, d1xks, d2s, d2x, d2xks]
      ksu:
        description: 'دمج KernelSU للنظام'
        required: false
        type: choice
        options: ['y', 'n']
        default: 'y'
      recovery:
        description: 'بناء للريكفري Android Recovery'
        required: false
        type: choice
        options: ['y', 'n']
        default: 'n'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. جلب السورس كود
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. تثبيت الأدوات وإصلاح مكتبات Ubuntu 24.04
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc curl zip git cpio python3 rsync lzop libncurses6 libncursesw6 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu llvm lld
          
          # تثبيت مكتبات ncurses5 المفقودة في النسخ الحديثة
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.1_amd64.deb && sudo dpkg -i libncurses5_6.3-2ubuntu0.1_amd64.deb

      - name: 3. إصلاح توافق KernelSU مع النواة (Hot-Fix)
        run: |
          # تفعيل ميزة المفاتيح في ملف الإعدادات الرسمي
          echo "CONFIG_KEYS=y" >> arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KEYS_COMPAT=y" >> arch/arm64/configs/exynos9820_defconfig
          
          # ترقيع كود KernelSU لتجاوز خطأ init_session_keyring في الأنوية القديمة
          # هذا التعديل يضمن تخطي فحص المفاتيح إذا لم تكن مدعومة
          if [ -f drivers/kernelsu/lsm_hooks.c ]; then
            sed -i 's/init_session_keyring/NULL/g' drivers/kernelsu/lsm_hooks.c
          fi

      - name: 4. الحقن الجراحي وتشغيل البناء
        run: |
          # استخدام ld.lld وحقن مكتبات Neutron 18
          sed -i 's/O=out/O=out \\\nLD=ld.lld \\\nCROSS_COMPILE=aarch64-linux-gnu- \\\nCROSS_COMPILE_ARM32=arm-linux-gnueabi- \\\nLD_LIBRARY_PATH=$PWD\/toolchain\/neutron_18\/lib:$LD_LIBRARY_PATH/g' build.sh
          
          chmod +x build.sh
          ./build.sh \
            --model "${{ github.event.inputs.model }}" \
            --ksu "${{ github.event.inputs.ksu }}" \
            --recovery "${{ github.event.inputs.recovery }}"
      
      - name: 5. رفع ملف الـ ZIP الناتج
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.model }}-zip
          path: build/out/${{ github.event.inputs.model }}/*.zip
          retention-days: 7
